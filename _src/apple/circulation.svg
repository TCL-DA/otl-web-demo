  <g><circle cx="384" cy="334" r="15" fill="#3d434d"/><text x="384" y="339" fill="#fff">5</text></g>
  <g><circle cx="796" cy="196" r="15" fill="#3d434d"/><text x="796" y="201" fill="#fff">6</text></g>
  <g><circle cx="1076" cy="216" r="15" fill="#3d434d"/><text x="1076" y="221" fill="#fff">7</text></g>
